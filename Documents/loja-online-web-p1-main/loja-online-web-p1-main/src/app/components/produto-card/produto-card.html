<div class="card cartao h-100">
  <a [routerLink]="['/detalhe', obj().codigo]" [attr.aria-label]="'Ver detalhes de ' + obj().nome">
    <img #foto [src]="obj().codigo + '.jpg'" [alt]="obj().nome" class="card-img-top foto" (error)="fotoIndisponivel($event)">
  </a>
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ obj().nome }}</h5>
    <p class="small text-muted mb-2 opcoes" *ngIf="grupo() as g">
      <span class="amostra me-1" *ngFor="let o of amostras()" [style.background-color]="o.cor" aria-hidden="true"></span>
      {{ g.opcoes.length }} opções de {{ g.titulo | lowercase }}
    </p>
    <div class="mt-auto d-flex justify-content-between align-items-end">
      <div>
        <div *ngIf="obj().valorPromo > 0">
          de: <s>{{ obj().valor | currency:'BRL' }}</s><br>
          <strong>por: {{ obj().valorPromo | currency:'BRL' }}</strong>
        </div>
        <div *ngIf="obj().valorPromo <= 0">
          <strong>{{ obj().valor | currency:'BRL' }}</strong>
        </div>
      </div>
      <button type="button" class="btn btn-outline-dark" *ngIf="obj().estoque > 0; else indisponivel" (click)="comprar()">Comprar</button>
      <ng-template #indisponivel><span class="badge text-bg-secondary">Indisponível</span></ng-template>
    </div>
  </div>
</div>
